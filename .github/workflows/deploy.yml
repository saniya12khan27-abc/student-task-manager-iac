name: Terraform CI/CD Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validate and Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terraform Validate
        run: terraform validate

      - name: Sync Existing Cloudflare Resources
        run: |
          KV_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/storage/kv/namespaces" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq -r '.result[] | select(.title=="student_tasks") | .id')
          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            echo "Importing existing KV namespace: $KV_ID"
            terraform import -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" cloudflare_workers_kv_namespace.tasks_kv "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/$KV_ID" || true
          fi
          echo "Importing existing Worker script if present..."
          terraform import -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" cloudflare_workers_script.task_manager_worker "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/student-task-manager" || true

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
